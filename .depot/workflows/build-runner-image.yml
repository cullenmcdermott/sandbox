# Depot build + publish of the runner image (the TypeScript Claude/OpenCode runner).
#
# Multi-arch (amd64+arm64) via depot/build-push-action — Depot builds each platform
# on a native builder (no QEMU) and caches layers in the project keyed by depot.json.
# On Depot-hosted runners the action authenticates to Depot over OIDC (configure the
# repo's trust relationship via the Depot GitHub App). GHCR push uses GITHUB_TOKEN.
name: Build Runner Image

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - '.depot/workflows/build-runner-image.yml'
      - 'depot.json'
  pull_request:
    paths:
      - 'runner/**'
      - '.depot/workflows/build-runner-image.yml'
      - 'depot.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC token for depot/build-push-action

env:
  IMAGE: ghcr.io/cullenmcdermott/sandbox-claude-runner

jobs:
  build:
    name: Build and Push
    runs-on: depot-ubuntu-24.04
    # Surface the pushed manifest digest so consumers can digest-pin
    # (image@sha256:…) instead of trusting tag stability.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # On Depot CI, GITHUB_TOKEN lacks GHCR package-write — use the org-wide
          # GHCR_TOKEN PAT (same pattern as node-debug-collector / disk-exporter).
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: depot/build-push-action@v1
        with:
          context: runner
          platforms: linux/amd64,linux/arm64
          # Only publish from main; PRs build both arches to catch breakage.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Emit pushed manifest digest
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Runner image published"
            echo ""
            echo "- ref: \`${IMAGE}:${GITHUB_SHA}\`"
            echo "- manifest digest: \`${DIGEST}\`"
            echo "- digest-pinned: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed ${IMAGE}@${DIGEST}"

      # --- prepull -------------------------------------------------------
      # Warm the just-published image on the big nodes so the next session pod
      # starts from a local layer set instead of a cold 700 MB WAN pull.
      #
      # Auth is Depot's own OIDC identity, federated into Tailscale (no static
      # OAuth secret) and then impersonated by the Tailscale operator's API
      # server proxy as the Kubernetes group "tag:ci-sandbox". The RBAC that
      # group binds lives in the homelab repo at
      # k8s/agent-sessions/ci-prepull-rbac.yaml and permits exactly: create,
      # get, list, watch, delete Jobs in agent-sessions, plus list nodes.
      - name: Tailscale
        if: github.ref == 'refs/heads/main' && steps.build.outputs.digest != ''
        uses: tailscale/github-action@v4
        with:
          # depot-sandbox federated identity. There is no oauth-secret: the
          # Depot job's own OIDC token is the credential, exchanged for a
          # Tailscale auth key. Client ID and audience are non-secret
          # identifiers, so they live here rather than in the secret store --
          # one fewer thing that can be silently unset.
          oauth-client-id: TDdC11111111CNTRL-kkB9y1Etex11CNTRL
          audience: api.tailscale.com/TDdC11111111CNTRL-kkB9y1Etex11CNTRL
          tags: tag:ci-sandbox

      - name: Prepull runner image onto the big nodes
        # Gate on the digest rather than on (ref == main && event == push).
        # The build step's own push condition is `ref == main`, so adding an
        # event check here would be STRICTER than the thing it mirrors and a
        # workflow_dispatch on main would publish without prepulling. An empty
        # digest is exactly "nothing was pushed", which also self-guards PR
        # builds, where push is false.
        if: github.ref == 'refs/heads/main' && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          KUBE_SERVER: https://tailscale-operator.yak-lionfish.ts.net
        run: |
          set -euo pipefail

          kubectl config set-cluster homelab --server="$KUBE_SERVER"
          # The placeholder token is load-bearing. The API server proxy in auth
          # mode identifies us from the tailnet connection itself, so no client
          # credential is needed -- but a context with an EMPTY user makes
          # client-go prompt "Please enter Username:" on stdin before it opens a
          # connection at all. In CI that prompt is a silent corruption, not a
          # failure: it goes to stdout, gets captured by the command
          # substitution below, and becomes the "node name". Any non-empty
          # authinfo suppresses it; `tailscale configure kubeconfig` writes the
          # same `token: unused`.
          kubectl config set-credentials tailscale-auth --token=unused
          kubectl config set-context homelab \
            --cluster=homelab --user=tailscale-auth --namespace=agent-sessions
          kubectl config use-context homelab

          # Diagnose the whole auth path in ONE run, then decide. Under
          # `set -e` the first failing probe aborts the step and every later
          # fact is lost, which costs a full build cycle per fact. These are
          # deliberately non-fatal; the gate is after them.
          echo "::group::auth diagnostics"
          set +e
          tailscale status --peers=false 2>&1 | head -3
          echo "--- proxy reachable? ---"
          curl -sS -o /dev/null -w 'GET /version -> http=%{http_code}\n' \
            --max-time 20 "$KUBE_SERVER/version"
          echo "--- who does the proxy think we are? ---"
          kubectl auth whoami -o yaml 2>&1 | sed 's/^/  /'
          WHOAMI_RC=${PIPESTATUS[0]}
          echo "--- can we do the things the Role grants? ---"
          kubectl auth can-i create jobs -n agent-sessions 2>&1
          kubectl auth can-i list nodes 2>&1
          set -e
          echo "::endgroup::"

          # 401 here means the tailnet grant is not matching (the proxy did not
          # resolve us to a Kubernetes subject at all). 403 would mean the grant
          # worked and RBAC is the problem. They need different fixes, in
          # different places, so name which one it is rather than failing with a
          # generic non-zero.
          if [ "$WHOAMI_RC" -ne 0 ]; then
            echo "::error::the API server proxy did not authenticate this device."
            echo "::error::Check the tailnet policy grant: src tag:ci-sandbox ->"
            echo "::error::dst tag:k8s-operator, app tailscale.com/cap/kubernetes"
            echo "::error::with impersonate.groups = [\"tag:ci-sandbox\"]."
            exit 1
          fi

          SHORT="${GITHUB_SHA::7}"
          # Via a file, not a process substitution: `mapfile < <(cmd)` discards
          # cmd's exit status, so a failed lookup silently yields a bogus list.
          kubectl get nodes -l sandbox.cullen.dev/pool=big \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' > "$RUNNER_TEMP/nodes.txt"
          mapfile -t NODES < <(grep -E '^[a-z0-9.-]+$' "$RUNNER_TEMP/nodes.txt" || true)
          if [ "${#NODES[@]}" -eq 0 ]; then
            echo "::warning::no nodes matched sandbox.cullen.dev/pool=big; skipping prepull"
            exit 0
          fi
          echo "prepull targets: ${NODES[*]}"

          # Emit one Job pinned to a specific node.
          #
          # Pull by DIGEST, not :latest -- the prepull then does not depend on
          # the tag-resolution path at all, is idempotent, and provably warms
          # the exact artifact this run published. imagePullPolicy IfNotPresent
          # is correct precisely because a digest is immutable.
          emit_job() {
            cat <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: runner-prepull-$1-${SHORT}
            namespace: agent-sessions
            labels:
              app.kubernetes.io/part-of: sandbox
          spec:
            ttlSecondsAfterFinished: 600   # self-GC; orphan-proof if CI dies mid-run
            backoffLimit: 2
            template:
              metadata:
                labels:
                  app.kubernetes.io/part-of: sandbox
              spec:
                nodeName: $1                # pin directly; no scheduler games
                restartPolicy: Never
                containers:
                  - name: prepull
                    image: ${IMAGE}@${DIGEST}
                    imagePullPolicy: IfNotPresent
                    command: ["/bin/true"]
                    resources:
                      requests: { cpu: 10m, memory: 16Mi }
                    securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      runAsUser: 1000
                      capabilities: { drop: ["ALL"] }
                      seccompProfile: { type: RuntimeDefault }
          EOF
          }

          # Stagger: run the first node to completion, then the rest in
          # parallel. All three at once would miss Spegel simultaneously and
          # pull ~2.1 GB from GHCR over the WAN; letting one land first means
          # the other two fetch layers from it over the LAN. Costs ~1 minute.
          FIRST="${NODES[0]}"
          REST=("${NODES[@]:1}")

          emit_job "$FIRST" | kubectl apply -f -
          kubectl wait --for=condition=complete --timeout=10m \
            "job/runner-prepull-${FIRST}-${SHORT}" || {
              echo "::warning::prepull did not complete on ${FIRST}; continuing"
            }

          for n in "${REST[@]}"; do emit_job "$n" | kubectl apply -f -; done
          for n in "${REST[@]}"; do
            kubectl wait --for=condition=complete --timeout=10m \
              "job/runner-prepull-${n}-${SHORT}" || {
                echo "::warning::prepull did not complete on ${n}"
              }
          done

          kubectl get jobs -l app.kubernetes.io/part-of=sandbox \
            --field-selector metadata.name!=x -o wide || true

          # NOTE: prepulled images are unreferenced once these Jobs are GC'd, so
          # they are eligible for kubelet image garbage collection. talos-juq-za9
          # has the smallest imagefs, so it is the one most likely to evict the
          # image before a session lands on it. That degrades silently -- the
          # session still works, it just pays the cold pull the prepull was
          # meant to avoid. Not worth designing around, but if warm-start
          # latency regresses on that node, check image GC first.
          echo "prepull complete for ${IMAGE}@${DIGEST}"
